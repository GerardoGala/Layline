<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layline | San Juan Academy</title>

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />


  <!-- STEP 1: Load Core Map Engines & Global Variables First -->
  <script src="js/globalSimulationData.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 
  <!-- STEP 2: Load Your Core Simulator Engine Layouts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ilcaHandleControls.js"></script>
  <script type="module" src="js/ilcaMap.js"></script>

  <!-- 3. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=.5, user-scalable=no">
</head>
  <div style="background-color: var(--nav-bg); color: var(--text-color); padding: 1rem; border-radius: 4px;">
    <h2>San Juan Academy</h2>
  </div>
  <section>
    <div id="map" >
    </div>
    <div id="divStart" class="mt-3 d-flex flex-column align-items-center justify-content-start w-100">
        <button id="startButton" class="btn btn-success btn-lg px-5 mb-3">Start</button>
        <!-- Wrap the button inside a link to index.html -->
        <a href="index.html" id="backButton" class="d-none">
            <button type="button" class="btn btn-primary btn-lg px-5 mb-3 w-100">Back to Main Menu</button>
        </a>
    </div>
  </section>

  <!-- Floating Indicator Panel-->
  <div style="
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-40%, -50%); /* Centered vertically and horizontally */
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
      min-width: 250px;
      text-align: center; /* 🎯 FIX: Centers the text inside the 250px box */
  ">
      <h2 style="
          margin: 0;
          padding: 0;
          font-size: 1.3rem;
          font-weight: 700;
          color: #0d6efd;
      ">Learn (steady wind)</h2>
  </div>
  <footer class="border-top mt-5 py-1">
    <div class="container text-center">
        <p class="mb-1">
            <strong>Dinghy Sailing Tutorial</strong>
        </p>
        <small class="text-body-secondary">
            Learn • Practice • Challenge
        </small>
    </div>
  </footer>
  <script>
    // Select the button elements
    const startButton = document.getElementById('startButton');
    const backButton = document.getElementById('backButton');

    // Handle the Start button click
    startButton.addEventListener('click', function() {
        launchSimulation();
        startButton.classList.add('d-none');
        backButton.classList.remove('d-none');
    });
    </script>
</html>
